name: tests

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            extras: core
          - python-version: "3.13"
            extras: core
          - python-version: "3.13"
            extras: integrations
    name: py${{ matrix.python-version }} / ${{ matrix.extras }}
    env:
      # No surprise pip installs mid-test; every dependency is declared below.
      VDISPLAY_AUTO_INSTALL: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system tools
        run: |
          sudo apt-get update
          # xrandr: monitor discovery expects the binary even when headless
          sudo apt-get install -y x11-xserver-utils
          if [ "${{ matrix.extras }}" = "integrations" ]; then
            sudo apt-get install -y tesseract-ocr
          fi

      - name: Install package (dev)
        run: |
          python -m pip install -U pip
          pip install -e packages/dsl2vdisplay -e packages/vdisplay-agent
          pip install -e ".[dev]" playwright

      - name: Install integration packages
        if: matrix.extras == 'integrations'
        run: pip install imgl vql "img2nl[analyze]" -e packages/nlp2vdisplay

      - name: Run tests
        run: pytest tests --ignore=tests/e2e -q
