      id: STARTER-046
      inputs:
        llm_model: qwen/qwen3-coder-next
        llm_timeout_seconds: 120.0
      labels:
      - api
      name: Stable vdisplay.vql / geometry / monitors API for the koru migration
      outputs:
        artifacts:
        - .planfile/artifacts/openrouter/STARTER-046.md
        notes:
        - "OPENROUTER-LLM qwen/qwen3-coder-next\n\n```diff\ndiff --git a/vdisplay/vql.py
          b/vdisplay/vql.py\nnew file mode 100644\nindex 0000000..e3b1c3e\n--- /dev/null\n+++
          b/vdisplay/vql.py\n@@ -0,0 +1,120 @@\n+\"\"\"VQL parsing, geometry transforms,
          and monitor topology utilities.\"\"\"\n+\n+from __future__ import annotations\n+\n+import
          re\n+from dataclasses import dataclass\n+from typing import List, Tuple,
          Optional\n+\n+\n+@dataclass(frozen=True)\n+class MonitorGeometry:\n+    \"\"\"Represents
          a monitor's position and size in virtual space.\"\"\"\n+    x: int\n+    y:
          int\n+    width: int\n+    height: int\n+\n+    def offset(self, dx: int,
          dy: int) -> MonitorGeometry:\n+        return MonitorGeometry(self.x + dx,
          self.y + dy, self.width, self.height)\n+\n+    def contains(self, point:
          Tuple[int, int]) -> bool:\n+        x, y = point\n+        return self.x
          <= x < self.x + self.width and self.y <= y < self.y + self.height\n+\n+\n+@dataclass(frozen=True)\n+class
          MonitorTopology:\n+    \"\"\"Ordered list of monitors with geometry and
          equivalence info.\"\"\"\n+    monitors: List[MonitorGeometry]\n+\n+    def
          by_position(self) -> List[MonitorGeometry]:\n+        return sorted(self.monitors,
          key=lambda m: (m.y, m.x))\n+\n+    def equivalent_to(self, other: MonitorTopology)
          -> bool:\n+        if len(self.monitors) != len(other.monitors):\n+            return
          False\n+        return all(\n+            m1.width == m2.width and m1.height
          == m2.height\n+            for m1, m2 in zip(self.by_position(), other.by_position())\n+
          \       )\n+\n+\n+def parse_vql_topology(vql_content: str) -> MonitorTopology:\n+
          \   \"\"\"Parse VQL string into MonitorTopology.\n+\n+    Expected format
          (simplified):\n+        MONITOR: x=1920 y=0 width=1920 height=1080\n+        MONITOR:
          x=0 y=0 width=2560 height=1440\n+    \"\"\"\n+    pattern = re.compile(\n+
          \       r\"MONITOR:\\s*x=(-?\\d+)\\s+y=(-?\\d+)\\s+width=(\\d+)\\s+height=(\\d+)\"\n+
          \   )\n+    geometries = []\n+    for line in vql_content.splitlines():\n+
          \       m = pattern.match(line.strip())\n+        if m:\n+            x,
          y, w, h = map(int, m.groups())\n+            geometries.append(MonitorGeometry(x,
          y, w, h))\n+    return MonitorTopology(geometries)\n+\n+\n+def transform_coordinates(\n+
          \   point: Tuple[int, int],\n+    src: MonitorTopology,\n+    dst: MonitorTopology,\n+)
          -> Tuple[int, int]:\n+    \"\"\"Map point from src topology coordinate space
          to dst topology.\"\"\"\n+    if not src.monitors or not dst.monitors:\n+
          \       return point\n+\n+    # Find source monitor containing point\n+
          \   src_monitor = next((m for m in src.monitors if m.contains(point)), None)\n+
          \   if not src_monitor:\n+        # Fallback: use first monitor\n+        src_monitor
          = src.monitors[0]\n+\n+    # Find corresponding monitor in dst (by index
          in sorted order)\n+    src_sorted = src.by_position()\n+    dst_sorted =
          dst.by_position()\n+    try:\n+        idx = src_sorted.index(src_monitor)\n+
          \       dst_monitor = dst_sorted[idx]\n+    except (ValueError, IndexError):\n+
          \       dst_monitor = dst_sorted[0] if dst_sorted else MonitorGeometry(0,
          0, 1920, 1080)\n+\n+    # Compute relative position within source monitor\n+
          \   rel_x = point[0] - src_monitor.x\n+    rel_y = point[1] - src_monitor.y\n+\n+
          \   # Map to destination monitor\n+    return (dst_monitor.x + rel_x, dst_monitor.y
          + rel_y)\n```\n\n**Rationale:** Extracts the core VQL parsing, geometry,
          and topology logic into a self-contained `vdisplay.vql` module with a minimal,
          testable API—enabling the koru move to be a pure import/replace refactor.
          The surface covers all three required concerns (parse, transform, topology
          equivalence) without over-engineering.\n\n**Test command:**  \n```bash\npython
          -c \"from vdisplay.vql import parse_vql_topology, transform_coordinates;
          t = parse_vql_topology('MONITOR: x=0 y=0 width=1920 height=1080\\nMONITOR:
          x=1920 y=0 width=1920 height=1080'); print(transform_coordinates((100, 100),
          t, t))\"\n```"
