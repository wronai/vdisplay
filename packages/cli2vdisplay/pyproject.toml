[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli2vdisplay"
version = "0.1.0"
description = "vdisplay control CLI REPL"
requires-python = ">=3.10"
dependencies = ["dsl2vdisplay>=0.1.0"]

[project.scripts]
cli2vdisplay = "cli2vdisplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
