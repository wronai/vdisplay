[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl2vdisplay"
version = "0.1.0"
description = "vdisplay control DSL — virtual display orchestration bus"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "vdisplay>=0.1.1",
    "jsonschema>=4.0",
    "protobuf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dsl2vdisplay = "dsl2vdisplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dsl2vdisplay" = ["schema/commands/*.json"]
