[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp2vdisplay"
version = "0.1.0"
description = "MCP server for vdisplay DSL"
requires-python = ">=3.10"
dependencies = ["dsl2vdisplay>=0.1.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
mcp2vdisplay = "mcp2vdisplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
