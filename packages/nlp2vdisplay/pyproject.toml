[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp2vdisplay"
version = "0.1.0"
description = "NL → vdisplay DSL"
requires-python = ">=3.10"
dependencies = ["dsl2vdisplay>=0.1.0"]

[project.scripts]
nlp2vdisplay = "nlp2vdisplay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
