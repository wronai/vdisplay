[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdisplay-agent"
version = "0.1.0"
description = "Local vdisplay broker — single install, many client apps via IPC"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
vdisplay-agent = "vdisplay_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
