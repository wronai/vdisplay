[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdisplay"
version = "0.1.1"
description = "Cross-platform virtual display orchestration with virtual and mirror sessions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Tom"}, {name = "Tom Sapletta",email = "tom@sapletta.com"}]
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
linux = []
windows = []
macos = []
pillow = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "Pillow>=10.0",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
]

[project.urls]
Homepage = "https://github.com/wronai/vdisplay"

[project.scripts]
vdisplay = "vdisplay.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
