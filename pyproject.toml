[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdisplay"
version = "0.1.50"
description = "Cross-platform virtual display orchestration with virtual and mirror sessions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Tom"}, {name = "Tom Sapletta",email = "tom@sapletta.com"}]
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
linux = []
windows = [
    "comtypes>=1.4.0",
]
macos = [
    "pyobjc-framework-ApplicationServices>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
]
pillow = ["Pillow>=10.0"]
sampler = ["Pillow>=10.0"]
dev = [
    "pytest>=8.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "httpx>=0.27",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
    "dsl2vdisplay",
    "vdisplay-agent",
    "uvicorn>=0.27",
    "pydantic>=2",
    "sqlmodel>=0.0.22",
]
core = [
    "pydantic>=2",
    "tenacity>=8.0",
    "structlog>=24.0",
]
control = [
    "dsl2vdisplay",
    "nlp2vdisplay",
]
auto = [
    "PyYAML>=6.0",
    "dsl2vdisplay",
    "planfile>=0.1.103",
    "imgl",
]
browser = [
    "playwright>=1.40",
]
e2e = [
    "playwright>=1.40",
    "pytest>=8.0",
]
vision = [
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.8",
    # coordinate-validation cursor detection (single-frame template match +
    # move-and-diff) is numpy-only so it runs without the heavier opencv;
    # opencv above remains the optional high-accuracy matchTemplate upgrade.
    "numpy>=1.24",
]
terminal = [
    "pyte>=0.8.1",
    "pexpect>=4.9",
    "wcwidth>=0.2.13",
]
uinput = [
    # deterministic absolute virtual pointer (LinuxUinputAbsInput) — an input
    # space we own, unlike ydotool's opaque one on multi-monitor HiDPI
    "evdev>=1.6",
]
portal = [
    # RemoteDesktop portal input (RemoteDesktopPortal) — the sanctioned Wayland
    # path: mouse+keyboard in the ScreenCast stream's own coordinate space.
    # Needs python-dbus + PyGObject + GStreamer (usually distro-provided).
    "dbus-python>=1.3",
    "PyGObject>=3.42",
]
agent = [
    "vdisplay-agent",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlmodel>=0.0.22",
]
img2nl = [
    "img2nl[analyze]",
]
imgl = [
    "imgl",
]
vql = [
    "vql",
    'img2vql; sys_platform == "linux"',
]
observe = [
    "imgl",
    "vql",
    'img2vql; sys_platform == "linux"',
]

[project.urls]
Homepage = "https://github.com/wronai/vdisplay"

[project.entry-points."vdisplay.control_providers"]
# Register custom ControlProvider adapters from installed packages, e.g.:
# my_adapter = "my_package.vdisplay_plugin:register"

[project.scripts]
vdisplay = "vdisplay.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "fastapi>=0.110",
    "httpx>=0.27",
    "uvicorn>=0.27",
    "dsl2vdisplay",
    "vdisplay-agent",
    "sqlmodel>=0.0.22",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "packages/dsl2vdisplay",
    "packages/nlp2vdisplay",
    "packages/vdisplay-agent",
    "packages/rest2vdisplay",
    "packages/mcp2vdisplay",
    "packages/cli2vdisplay",
    "packages/uri2vdisplay",
]

[tool.uv.sources]
vdisplay = { workspace = true }
dsl2vdisplay = { workspace = true }
nlp2vdisplay = { workspace = true }
vdisplay-agent = { workspace = true }
rest2vdisplay = { workspace = true }
mcp2vdisplay = { workspace = true }
cli2vdisplay = { workspace = true }
uri2vdisplay = { workspace = true }
# Sibling repos (github.com layout: wronai/vdisplay + semcod/imgl + oqlos/vql)
imgl = { path = "../../semcod/imgl", editable = true }
vql = { path = "../../oqlos/vql", editable = true }
img2vql = { path = "../../oqlos/vql/packages/img2vql", editable = true }

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "packages/vdisplay-agent/src", "tests"]
addopts = "-q"
markers = [
    "e2e: Playwright GUI tests (requires playwright + chromium)",
    "live: Playwright tests against running vdisplay-agent (VDISPLAY_AGENT_URL)",
]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore:on_event is deprecated:DeprecationWarning",
]